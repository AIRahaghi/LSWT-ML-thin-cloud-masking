[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lswt-thin-cloud-masking"
version = "0.1.0"
description = "Landsat-8/9 thin-cloud masking over inland and coastal waters using Fmask QA plus ML classifiers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "netCDF4>=1.6",
  "numpy>=1.24",
  "optuna>=3.5",
  "pandas>=2.0",
  "rasterio>=1.3",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "seaborn>=0.13",
  "xgboost>=2.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
